{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">編輯玩家資料</h2>

<div class="card p-4 shadow-sm">
  <!-- 名字 -->
  <div class="mb-3">
    <label class="form-label fw-bold">名字</label>
    <input type="text" class="form-control" value="{{ player.player_name }}" disabled>
  </div>

  <!-- 主職業 -->
  <div class="mb-3">
    <label class="form-label fw-bold">主職業</label>
    <input type="text" class="form-control" value="{{ player.main_job }}" disabled>
  </div>

  <!-- 分組 -->
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-bold">分組</label>
      <select class="form-select" name="group_name">
        <option value="" {% if not player.group_name %}selected{% endif %}>未分組</option>
        <option value="紅塵拆塔" {% if player.group_name == "紅塵拆塔" %}selected{% endif %}>紅塵拆塔</option>
        <option value="小崴大團" {% if player.group_name == "小崴大團" %}selected{% endif %}>小崴大團</option>
        <option value="步步機動" {% if player.group_name == "步步機動" %}selected{% endif %}>步步機動</option>
      </select>
    </div>

    <!-- 隊伍 -->
    <div class="mb-3">
      <label class="form-label fw-bold">隊伍</label>
      <select class="form-select" name="team_name">
        <option value="" {% if not player.team_name %}selected{% endif %}>未分隊</option>
        <option value="第一隊" {% if player.team_name == "第一隊" %}selected{% endif %}>第一隊</option>
        <option value="第二隊" {% if player.team_name == "第二隊" %}selected{% endif %}>第二隊</option>
        <option value="第三隊" {% if player.team_name == "第三隊" %}selected{% endif %}>第三隊</option>
        <option value="第四隊" {% if player.team_name == "第四隊" %}selected{% endif %}>第四隊</option>
        <option value="第五隊" {% if player.team_name == "第五隊" %}selected{% endif %}>第五隊</option>
      </select>
    </div>

    <!-- 標籤 -->
    <div class="mb-3">
      <label class="form-label fw-bold">標籤</label>
      <div class="d-flex gap-3">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" name="is_guild" id="is_guild"
                 {% if player.is_guild %}checked{% endif %}>
          <label class="form-check-label" for="is_guild">
            <span class="badge bg-success">幫眾</span>
          </label>
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" name="is_challenge" id="is_challenge"
                 {% if player.is_challenge %}checked{% endif %}>
          <label class="form-check-label" for="is_challenge">
            <span class="badge bg-danger">約戰</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 副職業 -->
    <div class="mb-3">
      <label class="form-label fw-bold">副職業</label>
      <select class="form-select" name="sub_job">
        <option value="">無</option>
        {% for j in all_jobs %}
        <option value="{{ j.name }}" {% if player.sub_job == j.name %}selected{% endif %}>{{ j.name }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- 備註 -->
    <div class="mb-3">
      <label class="form-label fw-bold">備註</label>
      <input type="text" class="form-control" name="role_note" value="{{ player.role_note or '' }}">
    </div>

    <!-- 儲存 / 返回 -->
    <div class="d-flex justify-content-between mt-4">
      <a href="{{ url_for('job_page', job=player.main_job) }}" class="btn btn-outline-secondary">返回</a>
      <button type="submit" class="btn btn-primary">💾 儲存</button>
    </div>
  </form>

  <!-- 狀態切換 -->
  <div class="mt-4">
    <label class="form-label fw-bold">狀態</label><br>
    <button class="btn {% if player.can_fight %}btn-success{% else %}btn-secondary{% endif %}"
            id="toggle-btn">
      {% if player.can_fight %}能打{% else %}請假{% endif %}
    </button>
  </div>
</div>

<script>
document.getElementById("toggle-btn").addEventListener("click", function() {
  fetch("/toggle/{{ player.id }}", {method: "POST"})
    .then(response => response.json())
    .then(data => {
      if (data.can_fight) {
        this.classList.remove("btn-secondary");
        this.classList.add("btn-success");
        this.textContent = "能打";
      } else {
        this.classList.remove("btn-success");
        this.classList.add("btn-secondary");
        this.textContent = "請假";
      }
    });
});
</script>
{% endblock %}
